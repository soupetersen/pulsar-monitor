name: Spike

# Phase 0 of the native UI (issue #6): builds the gpui prototype for
# Windows and Linux so it can be measured on real machines.
on:
  workflow_dispatch:
  push:
    branches: [native-ui]
    paths: ["spike/**", ".github/workflows/spike.yml"]

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, exe: pulsar-spike.exe }
          - { name: Linux, os: ubuntu-22.04, exe: pulsar-spike }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spike/gpui-compact
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libfontconfig-dev libfreetype-dev libssl-dev
      - run: cargo build --release
        working-directory: spike/gpui-compact
      - uses: actions/upload-artifact@v4
        with:
          name: pulsar-spike-${{ runner.os }}
          path: spike/gpui-compact/target/release/${{ matrix.exe }}
          if-no-files-found: error
