name: Release

# Started by `scripts/release.sh` (or by hand from the Actions tab): builds the
# installers of the chosen platforms for an existing version tag and attaches
# them to a draft release. The draft is published after a quick look.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build (e.g. v1.2.3)"
        required: true
      platforms:
        description: "windows, linux, macos, or a comma-separated subset"
        required: true
        default: "windows,linux,macos"

permissions:
  contents: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          # macOS builds Apple Silicon and Intel in parallel jobs.
          all='[
            {"key": "windows", "name": "Windows", "os": "windows-latest", "target": "", "exe": "target/release/pulsar.exe"},
            {"key": "linux", "name": "Linux", "os": "ubuntu-22.04", "target": "", "exe": "target/release/pulsar"},
            {"key": "macos", "name": "macOS (Apple Silicon)", "os": "macos-latest", "target": "aarch64-apple-darwin", "exe": "target/aarch64-apple-darwin/release/pulsar"},
            {"key": "macos", "name": "macOS (Intel)", "os": "macos-latest", "target": "x86_64-apple-darwin", "exe": "target/x86_64-apple-darwin/release/pulsar"}
          ]'
          matrix=$(jq -c --arg p "$PLATFORMS" '[.[] | select(.key as $k | $p | gsub(" "; "") | split(",") | index($k))]' <<< "$all")
          if [ "$matrix" = "[]" ]; then echo "No known platform in '$PLATFORMS'"; exit 1; fi
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev             libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libfontconfig-dev libfreetype-dev rpm

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Not preinstalled; Chocolatey's feed sometimes times out, so retry.
          for attempt in 1 2 3 4; do
            command -v makensis && break
            choco install nsis -y --no-progress && break
            sleep $((attempt * 15))
          done
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        run: cargo build --release ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Package
        shell: bash
        run: packaging/package.sh ${{ matrix.exe }} dist

      # The update packages get a minisign signature (.sig next to each) with
      # the key of the Tauri versions, which the updaters of both check.
      - name: Sign the update packages
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for f in dist/*-setup.exe dist/*.app.tar.gz dist/*.AppImage dist/*.deb dist/*.rpm; do
            [ -f "$f" ] && npx --yes @tauri-apps/cli@2.12.4 signer sign "$f"
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: pulsar-${{ matrix.key }}${{ matrix.target && format('-{0}', matrix.target) || '' }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          # latest.json: what the in-app updater reads from the latest published release.
          # Linux installs look for linux-x86_64-deb / -rpm first and fall back to the AppImage.
          base="https://github.com/$REPO/releases/download/$TAG"
          entry() { # <platform key> <file>
            [ -n "$2" ] && [ -f "$2.sig" ] || return 0
            jq -n --arg k "$1" --arg s "$(cat "$2.sig")" --arg u "$base/$(basename "$2")" '{($k): {signature: $s, url: $u}}'
          }
          windows=$(find dist -name '*-setup.exe' | head -1)
          linux=$(find dist -name '*.AppImage' | head -1)
          deb=$(find dist -name '*.deb' | head -1)
          rpm=$(find dist -name '*.rpm' | head -1)
          mac_arm=$(find dist -name '*aarch64.app.tar.gz' | head -1)
          mac_intel=$(find dist -name '*x86_64.app.tar.gz' | head -1)
          platforms=$({ entry windows-x86_64 "$windows"; entry linux-x86_64 "$linux"; entry linux-x86_64-deb "$deb"; entry linux-x86_64-rpm "$rpm"; entry darwin-aarch64 "$mac_arm"; entry darwin-x86_64 "$mac_intel"; } | jq -s 'add // {}')
          jq -n --arg v "${TAG#v}" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson p "$platforms" \
            '{version: $v, notes: "", pub_date: $d, platforms: $p}' > dist/latest.json
          cat dist/latest.json

          # Signatures live in latest.json.
          mapfile -t files < <(find dist -type f ! -name '*.sig')
          printf '%s\n' "${files[@]}"
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "${files[@]}" --repo "$REPO" --draft --title "Pulsar ${TAG#v}" --notes "Release notes coming soon."
          fi
