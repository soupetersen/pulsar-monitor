name: Release

# Started by `npm run release` (or by hand from the Actions tab): builds the
# installers of the chosen platforms for an existing version tag and attaches
# them to a draft release. The draft is published after a quick look.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build (e.g. v1.2.3)"
        required: true
      platforms:
        description: "windows, linux, macos, or a comma-separated subset"
        required: true
        default: "windows,linux,macos"

permissions:
  contents: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          # macOS builds Apple Silicon and Intel in parallel jobs instead of one
          # universal build, which compiled both one after the other.
          all='[
            {"key": "windows", "name": "Windows", "os": "windows-latest", "target": "", "args": "", "bundle": "src/core/target/release/bundle"},
            {"key": "linux", "name": "Linux", "os": "ubuntu-22.04", "target": "", "args": "", "bundle": "src/core/target/release/bundle"},
            {"key": "macos", "name": "macOS (Apple Silicon)", "os": "macos-latest", "target": "aarch64-apple-darwin", "args": "--target aarch64-apple-darwin", "bundle": "src/core/target/aarch64-apple-darwin/release/bundle"},
            {"key": "macos", "name": "macOS (Intel)", "os": "macos-latest", "target": "x86_64-apple-darwin", "args": "--target x86_64-apple-darwin", "bundle": "src/core/target/x86_64-apple-darwin/release/bundle"}
          ]'
          matrix=$(jq -c --arg p "$PLATFORMS" '[.[] | select(.key as $k | $p | gsub(" "; "") | split(",") | index($k))]' <<< "$all")
          if [ "$matrix" = "[]" ]; then echo "No known platform in '$PLATFORMS'"; exit 1; fi
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/core
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      # Also builds the signed update packages (.sig next to each installer,
      # plus the .app.tar.gz on macOS) that the in-app updater downloads.
      - name: Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":true}}'

      # Both Mac builds produce "Pulsar.app.tar.gz"; name them by architecture.
      - name: Name the macOS update package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd "${{ matrix.bundle }}/macos"
          arch="${{ matrix.target }}"; arch="${arch%%-*}"
          mv Pulsar.app.tar.gz "Pulsar_${arch}.app.tar.gz"
          mv Pulsar.app.tar.gz.sig "Pulsar_${arch}.app.tar.gz.sig"

      - uses: actions/upload-artifact@v4
        with:
          name: pulsar-${{ matrix.key }}${{ matrix.target && format('-{0}', matrix.target) || '' }}
          path: |
            ${{ matrix.bundle }}/nsis/*.exe
            ${{ matrix.bundle }}/nsis/*.exe.sig
            ${{ matrix.bundle }}/deb/*.deb
            ${{ matrix.bundle }}/deb/*.deb.sig
            ${{ matrix.bundle }}/rpm/*.rpm
            ${{ matrix.bundle }}/rpm/*.rpm.sig
            ${{ matrix.bundle }}/appimage/*.AppImage
            ${{ matrix.bundle }}/appimage/*.AppImage.sig
            ${{ matrix.bundle }}/dmg/*.dmg
            ${{ matrix.bundle }}/macos/*.app.tar.gz
            ${{ matrix.bundle }}/macos/*.app.tar.gz.sig
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          # latest.json: what the in-app updater reads from the latest published release.
          # Linux installs look for linux-x86_64-deb / -rpm first and fall back to the AppImage.
          base="https://github.com/$REPO/releases/download/$TAG"
          entry() { # <platform key> <file>
            [ -n "$2" ] && [ -f "$2.sig" ] || return 0
            jq -n --arg k "$1" --arg s "$(cat "$2.sig")" --arg u "$base/$(basename "$2")" '{($k): {signature: $s, url: $u}}'
          }
          windows=$(find dist -name '*-setup.exe' | head -1)
          linux=$(find dist -name '*.AppImage' | head -1)
          deb=$(find dist -name '*.deb' | head -1)
          rpm=$(find dist -name '*.rpm' | head -1)
          mac_arm=$(find dist -name '*aarch64.app.tar.gz' | head -1)
          mac_intel=$(find dist -name '*x86_64.app.tar.gz' | head -1)
          platforms=$({ entry windows-x86_64 "$windows"; entry linux-x86_64 "$linux"; entry linux-x86_64-deb "$deb"; entry linux-x86_64-rpm "$rpm"; entry darwin-aarch64 "$mac_arm"; entry darwin-x86_64 "$mac_intel"; } | jq -s 'add // {}')
          jq -n --arg v "${TAG#v}" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson p "$platforms" \
            '{version: $v, notes: "", pub_date: $d, platforms: $p}' > dist/latest.json
          cat dist/latest.json

          # Artifacts keep their bundle folders (nsis/, deb/, ...); signatures live in latest.json.
          mapfile -t files < <(find dist -type f ! -name '*.sig')
          printf '%s\n' "${files[@]}"
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "${files[@]}" --repo "$REPO" --draft --title "Pulsar ${TAG#v}" --notes "Release notes coming soon."
          fi
