name: Release

# Started by `npm run release` (or by hand from the Actions tab): builds the
# installers of the chosen platforms for an existing version tag and attaches
# them to a draft release. The draft is published after a quick look.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build (e.g. v1.2.3)"
        required: true
      platforms:
        description: "windows, linux, macos, or a comma-separated subset"
        required: true
        default: "windows,linux,macos"

permissions:
  contents: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          all='[
            {"key": "windows", "name": "Windows", "os": "windows-latest", "args": "", "bundle": "src/core/target/release/bundle"},
            {"key": "linux", "name": "Linux", "os": "ubuntu-22.04", "args": "", "bundle": "src/core/target/release/bundle"},
            {"key": "macos", "name": "macOS", "os": "macos-latest", "args": "--target universal-apple-darwin", "bundle": "src/core/target/universal-apple-darwin/release/bundle"}
          ]'
          matrix=$(jq -c --arg p "$PLATFORMS" '[.[] | select(.key as $k | $p | gsub(" "; "") | split(",") | index($k))]' <<< "$all")
          if [ "$matrix" = "[]" ]; then echo "No known platform in '$PLATFORMS'"; exit 1; fi
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # One dmg for Apple Silicon and Intel Macs.
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/core

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - run: npm run tauri build -- ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: pulsar-${{ matrix.key }}
          path: |
            ${{ matrix.bundle }}/nsis/*.exe
            ${{ matrix.bundle }}/deb/*.deb
            ${{ matrix.bundle }}/appimage/*.AppImage
            ${{ matrix.bundle }}/dmg/*.dmg
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          # Artifacts keep their bundle folders (nsis/, deb/, appimage/, dmg/).
          mapfile -t files < <(find dist -type f)
          printf '%s\n' "${files[@]}"
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "${files[@]}" --repo "$REPO" --draft --title "Pulsar ${TAG#v}" --notes "Release notes coming soon."
          fi
