name: Build

# Builds, tests and packages Pulsar on all three systems (unsigned packages,
# for a look before releasing).
on:
  push:
    branches: [main, native-ui]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, exe: pulsar.exe }
          - { name: Linux, os: ubuntu-22.04, exe: pulsar }
          - { name: macOS, os: macos-latest, exe: pulsar }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libfontconfig-dev libfreetype-dev rpm

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Not preinstalled; Chocolatey's feed sometimes times out, so retry.
          for attempt in 1 2 3 4; do
            command -v makensis && break
            choco install nsis -y --no-progress && break
            sleep $((attempt * 15))
          done
          echo "C:/Program Files (x86)/NSIS" >> "$GITHUB_PATH"

      - run: cargo test --release

      - run: cargo build --release

      - name: Package
        shell: bash
        run: packaging/package.sh target/release/${{ matrix.exe }} dist

      - uses: actions/upload-artifact@v4
        with:
          name: pulsar-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
