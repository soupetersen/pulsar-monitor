name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/core

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - run: npm run check

      - run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: pulsar-${{ runner.os }}
          path: |
            src/core/target/release/bundle/nsis/*.exe
            src/core/target/release/bundle/deb/*.deb
            src/core/target/release/bundle/rpm/*.rpm
            src/core/target/release/bundle/appimage/*.AppImage
            src/core/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
